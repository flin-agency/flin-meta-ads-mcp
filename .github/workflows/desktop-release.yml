name: macOS desktop packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r packaging/requirements.txt -r packaging/build-requirements.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Validate MCPB manifest schema
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate packaging/manifest.json
      - name: Run tests and security audit
        run: |
          python -m pip install pytest respx ruff mypy pip-audit
          ruff check .
          mypy src
          pytest -q
          pip-audit -r packaging/requirements.txt --disable-pip --no-deps
          pip-audit -r packaging/build-requirements.txt --disable-pip --no-deps
      - name: Build clean frozen package
        run: |
          python -m venv build/bundle-env
          build/bundle-env/bin/python -m pip install --require-hashes -r packaging/requirements.txt -r packaging/build-requirements.txt
          build/bundle-env/bin/python -m pip install --no-deps --no-build-isolation .
          build/bundle-env/bin/python scripts/build_mcpb.py
      - name: Verify packaged MCP handshake
        run: python scripts/smoke_mcpb.py dist/*-arm64.mcpb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-arm64
          path: |
            dist/*.mcpb
            dist/*.sha256
          if-no-files-found: error
